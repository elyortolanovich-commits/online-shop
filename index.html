<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Mağaza</title>
    <!-- PWA va Manifest ulanishi -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075e54">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="lang-switch">
            <button onclick="setLanguage('tr')">🇹🇷 TR</button>
            <button onclick="setLanguage('pl')">🇵🇱 PL</button>
        </div>
        <h1 id="shop-title">Online Mağaza</h1>
    </header>

    <!-- Kategoriyalar -->
    <div class="categories">
        <button onclick="filterCategory('all')" id="btn-all">Barchasi</button>
        <button onclick="filterCategory('fruits')" id="btn-fruits">Meva/Sabzavot</button>
        <button onclick="filterCategory('drinks')" id="btn-drinks">Ichimliklar</button>
        <button onclick="filterCategory('bakery')" id="btn-bakery">Non mahsulotlari</button>
        <button onclick="filterCategory('dairy')" id="btn-dairy">Sut mahsulotlari</button>
    </div>

    <!-- Mahsulotlar ro'yxati -->
    <main id="product-list" class="product-grid">
        <!-- JavaScript orqali mahsulotlar chiqadi -->
    </main>

    <!-- Savatcha qismi -->
    <div class="cart-container">
        <h2 id="cart-title">Savatcha</h2>
        <div id="cart-items"></div>
        <div class="cart-total">
            <span id="total-text">Jami:</span> <span id="total-price">0</span> zł
        </div>
        <button onclick="sendToWhatsApp()" id="whatsapp-btn" class="wa-button">WhatsApp orqali buyurtma berish</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
